name: Publish package

# Fires only on a deliberate release action: pushing a `vX.Y.Z` tag (e.g. via
# `gh release create vX.Y.Z --generate-notes`), or a manual dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and snapshot release branches (npm/vX.Y.Z, npm/latest)
        run: node scripts/release-package.mjs --push

      - name: Publish to npm
        run: npm publish tools/package/release --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
